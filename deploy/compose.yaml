services:
  app:
    image: weightings-analytics:${APP_REVISION:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./production.env
    environment:
      SITE_ACCESS_MODE: cloudflare
      DATABASE_PATH: /data/weightings-analytics.sqlite
      DRIZZLE_MIGRATIONS_PATH: /app/drizzle
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
